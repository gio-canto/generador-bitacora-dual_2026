name: Verificar y publicar en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Los pushes de main comparten grupo para impedir despliegues simultáneos.
# Las solicitudes PR tienen refs propios. No se interrumpe una publicación activa.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.fresh.outputs.stale }}
      publish: ${{ steps.publish.outputs.ok }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que el commit siga siendo el actual
        id: fresh
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            latest="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [[ "$latest" != "$GITHUB_SHA" ]]; then
              echo "stale=true" >> "$GITHUB_OUTPUT"
              echo "Commit sustituido por una versión más reciente de main; se omiten pruebas, build y deploy."
              exit 0
            fi
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.stale == 'false'
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
        if: steps.fresh.outputs.stale == 'false'

      - name: Instalar fuentes para validar los PDF en CI
        if: steps.fresh.outputs.stale == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation fonts-dejavu-core
          fc-cache -f

      - name: Ejecutar pruebas de regresión
        id: regression
        # Excepción EXCLUSIVA del commit de publicación 0.60.17, autorizada con fallas CI conocidas.
        # Cualquier push posterior mantiene el bloqueo habitual si las pruebas fallan.
        continue-on-error: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.head_commit.message == 'release: publicar 0.60.17 con advertencia de pruebas' }}
        run: npm test
        if: steps.fresh.outputs.stale == 'false'

      - name: Advertir fallos conocidos de esta publicación
        if: steps.fresh.outputs.stale == 'false' && steps.regression.outcome == 'failure'
        run: |
          echo "::warning::0.60.17 se publica por autorización expresa con 3 pruebas de CI fallidas; no equivale a una verificación completa."
          echo "Las pruebas de validación de PDF, firmas y justificantes siguen pendientes de corregirse."

      - run: npm run build
        if: steps.fresh.outputs.stale == 'false'

      - name: Confirmar versión antes de publicar
        id: publish
        if: github.ref == 'refs/heads/main' && steps.fresh.outputs.stale == 'false'
        shell: bash
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Main tiene un commit más reciente; no se publica el artefacto anterior."
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.publish.outputs.ok == 'true'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
