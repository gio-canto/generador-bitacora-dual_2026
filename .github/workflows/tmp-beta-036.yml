name: Prepare Beta 0.36
on:
  push:
    branches:
      - tmp/beta-036
    paths:
      - .github/workflows/tmp-beta-036.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/beta-036
      - name: Repair Beta 0.36 prepared files
        run: python .github/repair-beta-036.py
      - name: Commit prepared files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html faq/index.html
          git commit -m "Corregir estructura final de Beta 0.36"
          git push origin HEAD:tmp/beta-036
