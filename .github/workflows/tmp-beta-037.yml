name: Prepare Beta 0.37
on:
  push:
    branches:
      - tmp/beta-037
    paths:
      - .github/workflows/tmp-beta-037.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/beta-037
      - name: Apply Beta 0.37 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path=Path('index.html')
          index=index_path.read_text(encoding='utf-8')

          itch='  "Instituto Tecnológico de Chilpancingo (ITCH)":{start:"08:00",end:"15:00",area:"Área de Informática"},'
          uagro='  "Sistema de Universidad Virtual de la Universidad Autónoma de Guerrero (UAGro Virtual)":{start:"09:00",end:"14:00",area:"Área de Informática"},'
          if uagro not in index:
              if itch not in index: raise SystemExit('ITCH preset not found')
              index=index.replace(itch,itch+'\n'+uagro,1)

          nissan='  "Automóviles de Iguala, S.A. de C.V. (Nissan)":{start:"08:00",end:"15:00",area:"Área de Informática"},'
          chevy='  "Distribuidora Automotriz Acapulco, S.A. de C.V. (Chevrolet Chilpancingo)":{start:"09:00",end:"14:00",area:"Área de Informática"},'
          if chevy not in index:
              if nissan not in index: raise SystemExit('Nissan preset not found')
              index=index.replace(nissan,nissan+'\n'+chevy,1)

          old_first='if(!state)requestAnimationFrame(()=>welcome.showModal());'
          new_first='if(!state)requestAnimationFrame(startTour);'
          if old_first not in index: raise SystemExit('first visit onboarding pattern not found')
          index=index.replace(old_first,new_first,1)
          index_path.write_text(index,encoding='utf-8')

          readme_path=Path('README.md')
          readme=readme_path.read_text(encoding='utf-8')
          readme=readme.replace('Beta%200.36','Beta%200.37').replace('**Beta 0.36**','**Beta 0.37**')
          readme=readme.replace('- Pregunta de bienvenida en el primer acceso y tutorial guiado opcional.','- Tutorial guiado que se inicia automáticamente en el primer acceso y puede abrirse nuevamente desde el botón **Tutorial**.')
          schedule_line='- Horarios y área predeterminados ajustados automáticamente según la empresa seleccionada, sin impedir modificaciones manuales.'
          schedule_extra='- UAGro Virtual y Chevrolet Chilpancingo utilizan 09:00–14:00 como horario predeterminado.'
          if schedule_extra not in readme:
              readme=readme.replace(schedule_line,schedule_line+'\n'+schedule_extra,1)
          readme_path.write_text(readme,encoding='utf-8')

          faq_path=Path('faq/index.html')
          faq=faq_path.read_text(encoding='utf-8')

          css_anchor='.release-list{display:grid;gap:10px}'
          disclosure_css='.release-disclosure{margin-top:14px;background:#f7f7f9;box-shadow:none}.release-disclosure summary{padding:15px 48px 15px 16px;font-size:14px}.release-disclosure .release-list{padding:0 12px 12px}.release-disclosure[open]{box-shadow:none}'
          if disclosure_css not in faq:
              if css_anchor not in faq: raise SystemExit('release CSS anchor not found')
              faq=faq.replace(css_anchor,css_anchor+disclosure_css,1)

          schedule_question_old='<li><strong>TecNM Campus Chilpancingo:</strong> 08:00–15:00.</li><li><strong>100% Natural:</strong> 10:00–15:00.</li>'
          schedule_question_new='<li><strong>TecNM Campus Chilpancingo:</strong> 08:00–15:00.</li><li><strong>UAGro Virtual:</strong> 09:00–14:00.</li><li><strong>100% Natural:</strong> 10:00–15:00.</li>'
          if schedule_question_old in faq:
              faq=faq.replace(schedule_question_old,schedule_question_new,1)
          chevy_anchor='<li><strong>Nissan / Automóviles de Iguala:</strong> 08:00–15:00 y Área de Informática.</li><li><strong>La Avispa, Museo Interactivo:</strong> 10:00–15:00.</li>'
          chevy_new='<li><strong>Nissan / Automóviles de Iguala:</strong> 08:00–15:00 y Área de Informática.</li><li><strong>Chevrolet Chilpancingo:</strong> 09:00–14:00.</li><li><strong>La Avispa, Museo Interactivo:</strong> 10:00–15:00.</li>'
          if chevy_anchor in faq:
              faq=faq.replace(chevy_anchor,chevy_new,1)

          release_section='''<section class="release-notes" aria-labelledby="releaseNotesTitle"><span class="version-chip">Beta 0.37</span><h2 id="releaseNotesTitle">Notas de actualización</h2><p class="release-intro">Cambios recientes del Generador de Bitácora Dual 2026.</p><details class="release-disclosure"><summary>Ver historial de versiones</summary><div class="release-list"><article class="release-item"><div class="release-head"><strong>Beta 0.37</strong><span>Actual</span></div><ul><li>Las notas de actualización ahora permanecen ocultas dentro de una lista desplegable.</li><li>UAGro Virtual utiliza 09:00–14:00 como horario predeterminado.</li><li>Chevrolet Chilpancingo utiliza 09:00–14:00 como horario predeterminado.</li><li>El tutorial se inicia automáticamente la primera vez que una persona abre el sistema.</li></ul></article><article class="release-item"><div class="release-head"><strong>Beta 0.36</strong></div><ul><li>Avisos preventivos al seleccionar Falta, Sin labores y Día inhábil.</li><li>Justificación obligatoria para Falta y Sin labores; Día inhábil se completa automáticamente con la leyenda del calendario escolar vigente.</li><li>El PDF muestra también la justificación de Sin labores y Día inhábil.</li><li>Recordatorio final: no se permiten firmas digitales; las firmas deben ser autógrafas.</li><li>100% Natural actualiza su razón social a El Buen Tzin S.A. de C.V. (100% Natural).</li></ul></article><article class="release-item"><div class="release-head"><strong>Beta 0.35</strong></div><ul><li>Horarios predeterminados por empresa.</li><li>Área predeterminada de Informática para Nissan / Automóviles de Iguala.</li><li>Nueva sección de notas de actualización dentro del FAQ.</li></ul></article><article class="release-item"><div class="release-head"><strong>Beta 0.34</strong></div><ul><li>Se ampliaron los disparadores secretos del easter egg de créditos.</li></ul></article><article class="release-item"><div class="release-head"><strong>Beta 0.33</strong></div><ul><li>El PDF identifica la empresa debajo de Autorizó y del Instructor Formador usando abreviaturas cuando están disponibles.</li></ul></article><article class="release-item"><div class="release-head"><strong>Beta 0.32</strong></div><ul><li>Optimización de la generación del PDF y de la ventana “PDF listo”.</li><li>Menos trabajo de renderizado y menor bloqueo visual al terminar la exportación.</li></ul></article><article class="release-item"><div class="release-head"><strong>Beta 0.31</strong></div><ul><li>Catálogo de responsables de Autorizó para TecNM Campus Chilpancingo.</li><li>Etiquetas de firma para alumno, asesor de empresa y Vinculación.</li><li>Ajuste de proporción del logotipo en el PDF.</li></ul></article></div></details></section>'''
          faq,n=re.subn(r'<section class="release-notes" aria-labelledby="releaseNotesTitle">.*?</section>',release_section,faq,count=1,flags=re.S)
          if n!=1: raise SystemExit('release notes section replacement failed')
          faq=faq.replace('<section class="contribute"><span class="version-chip">Beta 0.36</span>','<section class="contribute"><span class="version-chip">Beta 0.37</span>',1)
          faq=faq.replace('<p class="version-note"><strong>Beta 0.36</strong></p>','<p class="version-note"><strong>Beta 0.37</strong></p>',1)
          faq_path.write_text(faq,encoding='utf-8')
          PY
          rm .github/workflows/tmp-beta-037.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md faq/index.html .github/workflows/tmp-beta-037.yml
          git commit -m "Preparar Beta 0.37 con tutorial y horarios"
          git push origin HEAD:tmp/beta-037
