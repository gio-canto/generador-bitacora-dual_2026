name: Prepare Beta 0.38
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/beta038_patch.py
      - run: |
          rm -f .github/workflows/tmp-beta-038.yml .github/beta038_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md faq/index.html .github/workflows/tmp-beta-038.yml .github/beta038_patch.py
          git commit -m "Preparar Beta 0.38 con avisos visuales y notas compactas"
          git push
