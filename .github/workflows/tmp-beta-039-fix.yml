name: Fix Beta 0.39 label
on:
  push:
    branches:
      - tmp/beta-039
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('faq/index.html')
          s=p.read_text()
          old='<section class="release-notes" aria-labelledby="releaseNotesTitle"><span class="version-chip">Beta 0.38</span>'
          new='<section class="release-notes" aria-labelledby="releaseNotesTitle"><span class="version-chip">Beta 0.39</span>'
          if old not in s: raise SystemExit('release chip not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: rm -f .github/workflows/tmp-beta-039-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faq/index.html .github/workflows/tmp-beta-039-fix.yml
          git commit -m "Corregir etiqueta de notas Beta 0.39"
          git push
