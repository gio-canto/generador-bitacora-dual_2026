name: Prepare Beta 0.39
on:
  push:
    branches:
      - tmp/beta-039
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/beta039_patch.py
      - run: rm -f .github/workflows/tmp-beta-039.yml .github/beta039_patch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md faq/index.html .github/workflows/tmp-beta-039.yml .github/beta039_patch.py
          git commit -m "Preparar Beta 0.39 con recordatorio persistente de faltas"
          git push
