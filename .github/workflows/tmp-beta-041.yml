name: Prepare Beta 0.41
on:
  push:
    branches:
      - tmp/beta-041
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/beta041_patch.py
      - run: rm -f .github/workflows/tmp-beta-041.yml .github/beta041_patch.py
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add index.html README.md faq/index.html .github/workflows/tmp-beta-041.yml .github/beta041_patch.py && git commit -m "Preparar Beta 0.41 sin texto redundante" && git push
