name: Prepare Beta 0.42
on:
  push:
    branches:
      - tmp/beta-042
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/beta042_patch.py
      - run: rm -f .github/workflows/tmp-beta-042.yml .github/beta042_patch.py
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add index.html README.md faq/index.html .github/workflows/tmp-beta-042.yml .github/beta042_patch.py && git commit -m "Preparar Beta 0.42 con rótulos especiales en negrita" && git push
