name: Prepare Beta 0.44
on:
  push:
    branches:
      - tmp/beta-044
    paths:
      - .github/workflows/tmp-beta-044.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/beta-044
      - name: Apply patch
        run: python3 .github/beta044_patch.py
      - name: Syntax check scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          for i,code in enumerate(scripts):
              p=Path(f'/tmp/beta044-{i}.js')
              p.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stdout,r.stderr)
                  sys.exit(r.returncode)
          print(f'Checked {len(scripts)} scripts')
          PY
      - name: Verify key changes
        run: |
          grep -q 'bitacora_dual_draft_v1' index.html
          grep -q 'Se requieren exactamente 4 días' index.html
          grep -q 'Líneas PDF:' index.html
          grep -q '<select id="group">' index.html
          grep -q 'Beta 0.44' README.md
          grep -q 'Beta 0.44' faq/index.html
      - name: Remove temporary files
        run: rm -f .github/workflows/tmp-beta-044.yml .github/beta044_patch.py
      - name: Commit prepared files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preparar Beta 0.44 con validaciones y autoguardado"
          git push
