name: Validate Beta 0.46 fix
on:
  push:
    branches: [tmp/beta-046]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/beta046_fix.py
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          assert scripts
          for i,code in enumerate(scripts):
              path=pathlib.Path(f'/tmp/inline-{i}.js')
              path.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(path)],check=True)
          PY
      - run: |
          rm -f .github/workflows/tmp-beta-046-fix.yml .github/beta046_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corregir y validar Beta 0.46"
          git push
