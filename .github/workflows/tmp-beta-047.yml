name: Prepare Beta 0.47
on:
  push:
    branches: ["tmp/beta-047"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/beta-047
      - name: Apply patch
        run: python3 .github/beta047_patch.py
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S)
          for i,script in enumerate(scripts):
              if not script.strip():
                  continue
              p=Path(f'/tmp/bitacora-script-{i}.js')
              p.write_text(script,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print(f'Validated {len(scripts)} script blocks')
          PY
      - name: Remove temporary files
        run: rm -f .github/beta047_patch.py .github/workflows/tmp-beta-047.yml
      - name: Commit prepared tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preparar Beta 0.47 con ajustes de interfaz"
          git push origin tmp/beta-047
