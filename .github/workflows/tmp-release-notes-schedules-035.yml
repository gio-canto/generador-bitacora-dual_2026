name: Prepare Beta 0.35
on:
  push:
    branches:
      - tmp/release-notes-schedules-035
    paths:
      - .github/workflows/tmp-release-notes-schedules-035.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/release-notes-schedules-035
      - name: Apply Beta 0.35 changes
        run: python .github/scripts/tmp_035.py
      - name: Commit prepared files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md faq/index.html
          git commit -m "Preparar Beta 0.35 con horarios y notas de actualización"
          git push origin HEAD:tmp/release-notes-schedules-035
