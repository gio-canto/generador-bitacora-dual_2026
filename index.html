<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#f5f5f7"/><meta name="description" content="Crea tu bitácora de Educación Dual paso a paso. Guarda tus jornadas y descarga un PDF desde tu teléfono, iPad o computadora."/><title>Bitácora Dual · Generador PDF</title><link rel="manifest" href="./manifest.webmanifest"/><link rel="apple-touch-icon" href="./Assets/generador-dual-apple-180.png"/><link rel="icon" type="image/png" sizes="32x32" href="./Assets/generador-dual-favicon-32.png"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><style>
