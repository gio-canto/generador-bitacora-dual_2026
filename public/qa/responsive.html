<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación adaptable · Bitácora Dual</title><style>body{font:16px system-ui;margin:24px;background:#e9e9ed;color:#1d1d1f}label,button{padding:10px}select,button{font:inherit;min-height:44px}iframe{display:block;border:1px solid #bbb;border-radius:16px;background:white;margin:20px auto;width:390px;height:1000px;max-width:none}p{max-width:70ch}header{position:sticky;top:0;background:#e9e9ed;padding:10px;z-index:1}</style></head><body><header><strong>Verificación de diseño</strong><label>Ancho <select id="width"><option value="390">Teléfono · 390 px</option><option value="768">Tableta · 768 px</option><option value="1024">Horizontal · 1024 px</option></select></label><label>Página <select id="page"><option value="../">Generador</option><option value="../faq/">Preguntas frecuentes</option></select></label></header><p>Herramienta para mantenimiento: muestra la aplicación real en distintos anchos. Comparte los datos locales del navegador. No simula Safari ni un dispositivo físico.</p><iframe title="Aplicación en revisión" src="../"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#width').addEventListener('change',e=>frame.style.width=e.target.value+'px');document.querySelector('#page').addEventListener('change',e=>frame.src=e.target.value);</script></body></html>
